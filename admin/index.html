<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DR EKON Admin">
<title>Admin — DR EKON</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0A0A0A;color:#F4F4F4;font-family:system-ui,-apple-system,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#0A0A0A}
  .fb{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  .fb b{color:#FFC61A;font-size:26px;font-style:italic}
  .fb a{background:#FFC61A;color:#0A0A0A;text-decoration:none;font-weight:800;padding:14px 22px;border-radius:14px}
  .fb p{color:#9A9A9A;font-size:14px;margin:0}
</style>
</head>
<body>
  <!-- Muncul sekejap semasa dashboard dimuatkan / kalau iframe tak boleh dibuka -->
  <div class="fb">
    <b>DR EKON</b>
    <p>Memuatkan dashboard…</p>
    <a id="direct" href="#">Buka dashboard terus</a>
  </div>
  <iframe id="dash" title="Dashboard Booking DR EKON" allow="clipboard-write"></iframe>
<script>
  var DASH = 'https://script.google.com/macros/s/AKfycbwoyuf-7FnNpxcr1gg_WuYJfSH1aVuExQbITBV-enYl7uEYBJ85nB4APsIt4IkKtHNn/exec?page=dashboard';
  document.getElementById('direct').href = DASH;
  document.getElementById('dash').src = DASH;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
