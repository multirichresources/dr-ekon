<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DR EKON">
<title>Admin — DR EKON</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --card:#151515; --card2:#1D1D1D; --line:#2A2A2A;
    --gold:#FFC61A; --txt:#F4F4F4; --mut:#9A9A9A; --wa:#22C063; --red:#FF6B6B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;padding-bottom:96px}
  button,select,input,textarea{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px}

  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(600px 300px at 50% 20%,rgba(255,198,26,.12),transparent 70%)}
  .lbox{width:100%;max-width:360px;text-align:center}
  .logo{font-size:34px;font-weight:800;font-style:italic;color:var(--gold);letter-spacing:-.5px}
  .lsub{color:var(--mut);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin:6px 0 32px}
  .pin{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;
    font-size:28px;text-align:center;letter-spacing:12px;outline:none}
  .pin:focus{border-color:var(--gold)}
  .btn-gold{width:100%;margin-top:14px;background:var(--gold);color:#0A0A0A;border:0;border-radius:16px;
    padding:17px;font-size:17px;font-weight:800;cursor:pointer}
  .err{color:var(--red);font-size:14px;margin-top:14px;min-height:20px}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;max-width:760px;margin:0 auto}
  .hd .t1{font-weight:800;font-style:italic;color:var(--gold);font-size:20px}
  .hd .t2{color:var(--mut);font-size:12px;margin-top:2px}
  .icon-btn{background:var(--card);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
  .spin{animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0 8px}
  @media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer}
  .stat .n{font-size:30px;font-weight:800;line-height:1}
  .stat .l{color:var(--mut);font-size:13px;margin-top:8px}
  .stat.hot{border-color:rgba(255,198,26,.5);background:linear-gradient(180deg,rgba(255,198,26,.10),var(--card))}
  .stat.hot .n{color:var(--gold)}

  /* sections */
  h2.sec{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:26px 0 12px;
    display:flex;align-items:center;gap:8px}
  h2.sec .c{background:var(--card2);color:var(--txt);border-radius:999px;padding:2px 9px;font-size:12px;letter-spacing:0}
  .hint{color:var(--mut);font-size:13px;margin:-4px 0 12px;line-height:1.5}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;color:var(--mut);font-size:15px}

  /* booking card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}
  .card.dup{border-color:rgba(255,107,107,.5)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .time{font-size:22px;font-weight:800}
  .time small{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-top:3px}
  .pill{border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;white-space:nowrap}
  .s-Baru{background:#FFF3C4;color:#7A5A00}
  .s-Disahkan{background:#DCEBFF;color:#0B3D91}
  .s-Dalam{background:#FFE0CC;color:#8A3B00}
  .s-Siap{background:#D6F5E0;color:#0B6B2E}
  .s-Batal{background:#3A3A3A;color:#BBB}
  .s-Tak{background:#FAD4D4;color:#9B1C1C}
  .nm{font-size:18px;font-weight:700;margin-top:14px;text-transform:capitalize}
  .car{color:var(--mut);font-size:14px;margin-top:4px}
  .car b{color:var(--txt);font-weight:700;letter-spacing:.5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px}
  .note{background:var(--card2);border-left:3px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;
    color:#D6D6D6;margin-top:12px;line-height:1.5}
  .note.k{border-left-color:var(--gold)}
  .note.w{border-left-color:var(--red);color:#FFC9C9}
  .meta{font-size:12px;color:var(--mut);margin-top:10px}
  .meta span{color:var(--wa)}
  .row2{display:flex;gap:8px;margin-top:14px}
  select.st{flex:1;background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:13px 12px;
    font-size:15px;font-weight:700;appearance:none;-webkit-appearance:none;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
    background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
  .sq{width:50px;flex:none;background:var(--card2);border:1.5px solid var(--line);border-radius:14px;display:flex;
    align-items:center;justify-content:center;font-size:18px;cursor:pointer}
  .acts{display:grid;gap:8px;margin-top:8px}
  .wa{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--wa);color:#fff;border-radius:14px;
    padding:14px;font-weight:800;font-size:15px;cursor:pointer;border:0}
  .wa.ghost{background:transparent;border:1.5px solid rgba(34,192,99,.55);color:#5BE08F}
  .wa.done{background:transparent;border:1.5px solid var(--line);color:var(--mut)}
  .nedit{margin-top:10px;display:none}
  .nedit.on{display:block}
  .nedit textarea{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:12px;
    font-size:15px;min-height:80px;resize:vertical;outline:none}
  .nedit textarea:focus{border-color:var(--gold)}
  .nedit button{margin-top:8px;background:var(--gold);color:#0A0A0A;border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}

  /* date group */
  .dg{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .dg b{font-size:16px}
  .dg span{color:var(--mut);font-size:13px}

  /* customer */
  .search{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;
    font-size:16px;outline:none;margin-top:18px}
  .search:focus{border-color:var(--gold)}
  .cust{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;cursor:pointer}
  .cust .r1{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .cust .cn{font-weight:700;font-size:16px;text-transform:capitalize}
  .cust .cc{background:var(--card2);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--gold);font-weight:700;white-space:nowrap}
  .cust .cs{color:var(--mut);font-size:13px;margin-top:5px}
  .hist{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .cust.open .hist{display:block}
  .hl{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid #202020}
  .hl:last-child{border-bottom:0}
  .hl .hm{color:var(--mut)}
  .cact{display:flex;gap:8px;margin-top:10px}
  .cact a{flex:1}

  /* bottom nav */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,14,14,.96);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .nv{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
  .nv button{background:none;border:0;padding:11px 4px 12px;cursor:pointer;color:var(--mut);font-size:11.5px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
  .nv button .i{font-size:20px;line-height:1}
  .nv button.on{color:var(--gold)}
  .nv .bd{position:absolute;top:6px;left:calc(50% + 8px);background:var(--red);color:#fff;border-radius:999px;
    font-size:10.5px;padding:1px 6px;min-width:18px}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#FFF;color:#0A0A0A;
    padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:50;
    max-width:90vw;text-align:center;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.bad{background:var(--red);color:#fff}
  .loading{text-align:center;color:var(--mut);padding:60px 0}
  [hidden]{display:none!important}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lbox">
    <div class="logo" id="lLogo">DR EKON</div>
    <div class="lsub">Dashboard Booking</div>
    <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••••">
    <button class="btn-gold" id="goBtn">Masuk</button>
    <div class="err" id="lErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <header>
    <div class="hd">
      <div>
        <div class="t1" id="hBiz">DR EKON</div>
        <div class="t2" id="hDate"></div>
      </div>
      <button class="icon-btn" id="refBtn" title="Refresh">⟳</button>
    </div>
  </header>

  <main class="wrap">
    <div class="stats" id="stats"></div>
    <section id="v-today"></section>
    <section id="v-next" hidden></section>
    <section id="v-follow" hidden></section>
    <section id="v-cust" hidden>
      <input class="search" id="q" placeholder="Cari nama, telefon atau no. plat">
      <div id="custList"></div>
    </section>
  </main>

  <nav>
    <div class="nv">
      <button data-v="today" class="on"><span class="i">◉</span>Hari Ini</button>
      <button data-v="next"><span class="i">▦</span>Akan Datang</button>
      <button data-v="follow"><span class="i">⚑</span>Follow Up<span class="bd" id="fBadge" hidden></span></button>
      <button data-v="cust"><span class="i">☺</span>Customer</button>
    </div>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var PIN = '', D = null, VIEW = 'today', Q = '';
  var HARI = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
  var BLN = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
  var BULAN = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
  var INACTIVE = ['Batal','Tak datang'];
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- server ---------- */
  var API = 'https://script.google.com/macros/s/AKfycbwoyuf-7FnNpxcr1gg_WuYJfSH1aVuExQbITBV-enYl7uEYBJ85nB4APsIt4IkKtHNn/exec';
  function api(body){
    body.action = 'dash';
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function(r){ return r.json(); }, function(){ throw 'Tiada sambungan internet. Cuba lagi.'; })
      .then(function(j){ if (!j || !j.ok) throw (j && j.error) || 'Ralat server. Cuba lagi.'; return j; });
  }
  function call(fn, pin, row, ref, changes){
    return fn === 'dashData' ? api({ op: 'data', pin: pin }) : api({ op: 'update', pin: pin, row: row, ref: ref, changes: changes });
  }

  /* ---------- helpers ---------- */
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function addDays(iso, n){ var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
  function dObj(iso){ var p = iso.split('-').map(Number); return { y:p[0], m:p[1], d:p[2], w:new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay() }; }
  function dShort(iso){ if(!iso) return '-'; var o = dObj(iso); return HARI[o.w] + ', ' + o.d + ' ' + BLN[o.m-1]; }
  function dLong(iso){ var o = dObj(iso); return HARI[o.w] + ', ' + o.d + ' ' + BULAN[o.m-1] + ' ' + o.y; }
  function slotLbl(s){ var h = Number(String(s).slice(0,2)), m = String(s).slice(3,5); if(isNaN(h)) return esc(s);
    return (h > 12 ? h-12 : h) + ':' + m + ' ' + (h < 12 ? 'pagi' : (h < 14 ? 'tghari' : 'petang')); }
  function slotFull(s){ var h = Number(String(s).slice(0,2)), m = String(s).slice(3,5);
    return (h > 12 ? h-12 : h) + ':' + m + ' ' + (h < 12 ? 'pagi' : (h < 14 ? 'tengah hari' : 'petang')); }
  function waNum(t){ var d = String(t).replace(/\D/g,''); if(d.charAt(0) === '0') d = '6' + d; return d; }
  function telKey(t){ var d = String(t).replace(/\D/g,''); if(d.indexOf('60') === 0) d = d.slice(1); return d; }
  function first(n){ n = String(n).trim().toLowerCase().replace(/\b\w/g, function(c){ return c.toUpperCase(); }); return n; }
  function active(b){ return INACTIVE.indexOf(b.status) < 0; }
  function stCls(s){ return 's-' + String(s).split(' ')[0]; }
  function bySlot(a, b){ return (a.date + a.slot).localeCompare(b.date + b.slot); }
  function waLink(b, msg){ return 'https://wa.me/' + waNum(b.tel) + (msg ? '?text=' + encodeURIComponent(msg) : ''); }

  var toastT;
  function toast(m, bad){ var t = $('toast'); t.textContent = m; t.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(function(){ t.className = 'toast'; }, 2400); }
  function store(k, v){ try { if(v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){} }
  function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }

  /* ---------- mesej WhatsApp ---------- */
  function msgSahkan(b){
    return 'Assalamualaikum ' + first(b.nama) + ',\n\nBooking anda di ' + D.business + ' telah *DISAHKAN* ✅\n\n' +
      'No. Rujukan: ' + b.ref + '\nTarikh: ' + dLong(b.date) + '\nMasa: ' + slotFull(b.slot) +
      '\nKereta: ' + b.kereta + (b.plat ? ' (' + b.plat + ')' : '') +
      '\n\nKalau ada perubahan, balas mesej ni ya. Terima kasih!';
  }
  function msgReminder(b){
    var bila = b.date === addDays(D.today, 1) ? '*esok*, ' + dLong(b.date) : dLong(b.date);
    return 'Assalamualaikum ' + first(b.nama) + ',\n\nPeringatan mesra untuk servis aircond kereta anda di ' + D.business + ':\n\n' +
      '📅 ' + bila + '\n⏰ ' + slotFull(b.slot) + '\n🚗 ' + b.kereta + (b.plat ? ' (' + b.plat + ')' : '') +
      '\nNo. Rujukan: ' + b.ref + '\n\nBalas *YA* untuk sahkan kehadiran, atau beritahu kami kalau nak tukar masa. Terima kasih!';
  }
  function msgReview(b){
    return 'Assalamualaikum ' + first(b.nama) + ',\n\nTerima kasih kerana servis ' + b.kereta + ' di ' + D.business + ' 🙏\n\n' +
      'Kalau anda puas hati, sudi tak luangkan 1 minit bagi review di Google? Sangat membantu bengkel kami:\n' + D.reviewUrl +
      '\n\nKalau ada apa-apa masalah lepas servis, terus WhatsApp kami ya.';
  }

  /* ---------- kiraan ---------- */
  function compute(){
    var B = D.bookings, t = D.today, tm = addDays(t, 1), d14 = addDays(t, -14), month = t.slice(0,7);
    var dupCount = {};
    B.forEach(function(b){ if(active(b) && b.date >= t){ var k = telKey(b.tel) + '|' + b.date; dupCount[k] = (dupCount[k] || 0) + 1; } });
    B.forEach(function(b){ b.dup = active(b) && b.date >= t && dupCount[telKey(b.tel) + '|' + b.date] > 1; });

    var F = {
      dup:     B.filter(function(b){ return b.dup; }).sort(bySlot),
      sahkan:  B.filter(function(b){ return b.status === 'Baru' && b.date >= t && !b.dup; }).sort(bySlot),
      remind:  B.filter(function(b){ return b.date === tm && (b.status === 'Baru' || b.status === 'Disahkan') && !b.rem; }).sort(bySlot),
      review:  D.reviewUrl ? B.filter(function(b){ return b.status === 'Siap' && !b.rev && b.date >= d14; }).sort(bySlot) : [],
      lapuk:   B.filter(function(b){ return b.date && b.date < t && ['Baru','Disahkan','Dalam servis'].indexOf(b.status) > -1; }).sort(bySlot).reverse()
    };
    var uniq = {};
    Object.keys(F).forEach(function(k){ F[k].forEach(function(b){ uniq[b.row] = 1; }); });

    return {
      today: B.filter(function(b){ return b.date === t && active(b); }).sort(bySlot),
      todayAll: B.filter(function(b){ return b.date === t; }).sort(bySlot),
      tomorrow: B.filter(function(b){ return b.date === tm && active(b); }),
      next: B.filter(function(b){ return b.date > t && active(b); }).sort(bySlot),
      month: B.filter(function(b){ return b.date.slice(0,7) === month && active(b); }),
      follow: F,
      followN: Object.keys(uniq).length
    };
  }

  /* ---------- render ---------- */
  function card(b, opts){
    opts = opts || {};
    var t = D.today, future = b.date >= t, past = b.date < t;
    var chips = String(b.masalah || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean)
      .map(function(s){ return '<span class="chip">' + esc(s) + '</span>'; }).join('');
    var opt = D.statuses.map(function(s){ return '<option' + (s === b.status ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('');

    var acts = [];
    if (b.status === 'Baru' && future) {
      acts.push('<a class="wa" target="_blank" href="' + esc(waLink(b, msgSahkan(b))) + '" data-act="sahkan" data-row="' + b.row + '">✓ Sahkan &amp; WhatsApp</a>');
    }
    if (future && b.date <= addDays(t, 1) && (b.status === 'Baru' || b.status === 'Disahkan') && b.date !== t) {
      acts.push(b.rem
        ? '<a class="wa done" target="_blank" href="' + esc(waLink(b, msgReminder(b))) + '" data-act="rem" data-row="' + b.row + '">✓ Reminder dihantar ' + esc(b.rem) + '</a>'
        : '<a class="wa ghost" target="_blank" href="' + esc(waLink(b, msgReminder(b))) + '" data-act="rem" data-row="' + b.row + '">⏰ Hantar Reminder</a>');
    }
    if (b.status === 'Siap' && D.reviewUrl) {
      acts.push(b.rev
        ? '<a class="wa done" target="_blank" href="' + esc(waLink(b, msgReview(b))) + '" data-act="rev" data-row="' + b.row + '">✓ Review diminta ' + esc(b.rev) + '</a>'
        : '<a class="wa ghost" target="_blank" href="' + esc(waLink(b, msgReview(b))) + '" data-act="rev" data-row="' + b.row + '">★ Minta Review Google</a>');
    }

    var nota = b.nota ? '<div class="note ' + (b.nota.indexOf('⚠') === 0 ? 'w' : 'k') + '">📝 ' + esc(b.nota) + '</div>' : '';
    var dup = b.dup ? '<div class="note w">⚠ No. telefon ni ada lebih dari satu booking pada hari yang sama. Semak, dan tukar yang berganda kepada "Batal".</div>' : '';

    return '<div class="card' + (b.dup ? ' dup' : '') + '" id="c' + b.row + '">' +
      '<div class="top"><div class="time">' + slotLbl(b.slot) +
        (opts.showDate || past || b.date !== t ? '<small>' + dShort(b.date) + '</small>' : '') + '</div>' +
        '<span class="pill ' + stCls(b.status) + '">' + esc(b.status) + '</span></div>' +
      '<div class="nm">' + esc(String(b.nama).toLowerCase()) + '</div>' +
      '<div class="car">' + esc(b.kereta) + (b.plat ? ' · <b>' + esc(b.plat) + '</b>' : '') + '</div>' +
      (chips ? '<div class="chips">' + chips + '</div>' : '') +
      (b.catatan ? '<div class="note">“' + esc(b.catatan) + '”</div>' : '') +
      dup + nota +
      '<div class="meta">' + esc(b.ref) + ' · ' + esc(b.tel) + '</div>' +
      '<div class="row2">' +
        '<select class="st" data-row="' + b.row + '">' + opt + '</select>' +
        '<a class="sq" href="tel:' + esc(String(b.tel).replace(/[^\d+]/g,'')) + '" title="Call">📞</a>' +
        '<a class="sq" target="_blank" href="' + esc(waLink(b)) + '" title="WhatsApp">💬</a>' +
        '<button class="sq" data-note="' + b.row + '" title="Nota kerani">✎</button>' +
      '</div>' +
      '<div class="nedit" id="n' + b.row + '"><textarea placeholder="Nota kerani (contoh: dah call, customer minta tukar 11:30)">' + esc(b.nota) + '</textarea>' +
        '<button data-savenote="' + b.row + '">Simpan Nota</button></div>' +
      (acts.length ? '<div class="acts">' + acts.join('') + '</div>' : '') +
    '</div>';
  }

  function sec(title, n, hint){ return '<h2 class="sec">' + title + (n != null ? ' <span class="c">' + n + '</span>' : '') + '</h2>' + (hint ? '<p class="hint">' + hint + '</p>' : ''); }

  function render(){
    var C = compute();
    $('hBiz').textContent = D.business.split(' ').slice(0,2).join(' ');
    $('hDate').textContent = dLong(D.today);

    $('stats').innerHTML =
      '<div class="stat" data-go="today"><div class="n">' + C.today.length + '</div><div class="l">Booking hari ini</div></div>' +
      '<div class="stat" data-go="next"><div class="n">' + C.tomorrow.length + '</div><div class="l">Booking esok</div></div>' +
      '<div class="stat' + (C.followN ? ' hot' : '') + '" data-go="follow"><div class="n">' + C.followN + '</div><div class="l">Perlu tindakan</div></div>' +
      '<div class="stat"><div class="n">' + C.month.length + '</div><div class="l">Booking bulan ni</div></div>';

    var fb = $('fBadge'); fb.hidden = !C.followN; fb.textContent = C.followN;

    // HARI INI
    var cancelled = C.todayAll.length - C.today.length;
    $('v-today').innerHTML = sec('Hari Ini', C.today.length) +
      (C.today.length ? C.today.map(function(b){ return card(b); }).join('') : '<div class="empty">Tiada booking untuk hari ini.</div>') +
      (cancelled ? '<p class="hint" style="margin-top:12px">' + cancelled + ' booking hari ini berstatus Batal / Tak datang.</p>' : '');

    // AKAN DATANG
    var html = sec('Akan Datang', C.next.length), cur = '';
    if (!C.next.length) html += '<div class="empty">Tiada booking akan datang.</div>';
    C.next.forEach(function(b){
      if (b.date !== cur) {
        cur = b.date;
        var n = C.next.filter(function(x){ return x.date === cur; }).length;
        var tag = cur === addDays(D.today, 1) ? 'Esok — ' : '';
        html += '<div class="dg"><b>' + tag + dShort(cur) + '</b><span>' + n + ' kereta</span></div>';
      }
      html += card(b);
    });
    $('v-next').innerHTML = html;

    // FOLLOW UP
    var F = C.follow, fh = '';
    if (F.dup.length) fh += sec('Booking berganda', F.dup.length, 'Customer sama, hari sama. Biasanya tertekan butang dua kali. Kekalkan satu, tukar yang lain kepada "Batal" supaya slot terbuka semula.') + F.dup.map(function(b){ return card(b, {showDate:1}); }).join('');
    if (F.sahkan.length) fh += sec('Belum disahkan', F.sahkan.length, 'Tekan "Sahkan &amp; WhatsApp" — status terus tukar jadi Disahkan dan mesej pengesahan siap ditaip.') + F.sahkan.map(function(b){ return card(b, {showDate:1}); }).join('');
    if (F.remind.length) fh += sec('Reminder untuk esok', F.remind.length, 'Hantar peringatan supaya customer tak lupa datang.') + F.remind.map(function(b){ return card(b, {showDate:1}); }).join('');
    if (F.review.length) fh += sec('Minta review Google', F.review.length, 'Servis dah siap dalam 14 hari lepas.') + F.review.map(function(b){ return card(b, {showDate:1}); }).join('');
    if (F.lapuk.length) fh += sec('Status belum dikemaskini', F.lapuk.length, 'Tarikh dah lepas tapi status belum Siap / Tak datang. Kemaskini supaya rekod dan laporan bulanan tepat.') + F.lapuk.map(function(b){ return card(b, {showDate:1}); }).join('');
    if (!D.reviewUrl) fh += '<p class="hint" style="margin-top:20px">ℹ Butang "Minta Review Google" akan muncul bila link review diisi dalam tetapan.</p>';
    $('v-follow').innerHTML = fh || sec('Follow Up', 0) + '<div class="empty">Semua beres 👍 Tiada yang perlu di-follow up.</div>';

    renderCust();
  }

  function renderCust(){
    var map = {};
    D.bookings.forEach(function(b){
      var k = telKey(b.tel); if (!k) return;
      (map[k] = map[k] || { k:k, list:[] }).list.push(b);
    });
    var q = Q.trim().toLowerCase(), qd = q.replace(/\D/g,'');
    var arr = Object.keys(map).map(function(k){
      var c = map[k]; c.list.sort(bySlot);
      var l = c.list[c.list.length - 1];
      c.nama = l.nama; c.tel = l.tel; c.last = l;
      c.siap = c.list.filter(function(b){ return b.status === 'Siap'; }).length;
      c.kereta = c.list.map(function(b){ return b.kereta + (b.plat ? ' (' + b.plat + ')' : ''); })
        .filter(function(v, i, a){ return a.indexOf(v) === i; }).join(', ');
      return c;
    }).filter(function(c){
      if (!q) return true;
      var hay = (c.list.map(function(b){ return b.nama + ' ' + b.plat + ' ' + b.kereta; }).join(' ')).toLowerCase().replace(/\s+/g,' ');
      return hay.indexOf(q) > -1 || hay.replace(/\s/g,'').indexOf(q.replace(/\s/g,'')) > -1 || (qd.length >= 3 && c.k.indexOf(qd.replace(/^6/,'')) > -1);
    }).sort(function(a, b){ return (b.last.date + b.last.slot).localeCompare(a.last.date + a.last.slot); });

    $('custList').innerHTML = '<h2 class="sec">Customer <span class="c">' + arr.length + '</span></h2>' + (arr.length ? arr.map(function(c){
      return '<div class="cust" data-cust>' +
        '<div class="r1"><div class="cn">' + esc(String(c.nama).toLowerCase()) + '</div><span class="cc">' + c.list.length + ' booking' + (c.siap ? ' · ' + c.siap + ' siap' : '') + '</span></div>' +
        '<div class="cs">' + esc(c.tel) + ' · ' + esc(c.kereta) + '</div>' +
        '<div class="hist">' + c.list.slice().reverse().map(function(b){
          return '<div class="hl"><div>' + dShort(b.date) + ', ' + slotLbl(b.slot) + '<div class="hm">' + esc(b.masalah || '-') + '</div></div><span class="pill ' + stCls(b.status) + '" style="align-self:center">' + esc(b.status) + '</span></div>';
        }).join('') +
        '<div class="cact"><a class="wa ghost" target="_blank" href="' + esc(waLink(c.last)) + '">💬 WhatsApp</a></div></div>' +
      '</div>';
    }).join('') : '<div class="empty">Tiada customer dijumpai.</div>');
  }

  function show(v){
    VIEW = v;
    ['today','next','follow','cust'].forEach(function(k){ $('v-' + k).hidden = k !== v; });
    [].forEach.call(document.querySelectorAll('.nv button'), function(b){ b.classList.toggle('on', b.dataset.v === v); });
    window.scrollTo(0, 0);
  }

  /* ---------- data ---------- */
  function refresh(quiet){
    var rb = $('refBtn'); rb.classList.add('spin');
    return call('dashData', PIN).then(function(d){
      D = d; render(); if (!quiet) toast('Data terkini dimuatkan');
    }).catch(function(e){
      toast(e, true);
      if (/PIN/.test(e)) logout();
    }).then(function(){ rb.classList.remove('spin'); });
  }
  function find(row){ row = Number(row); return D.bookings.filter(function(b){ return b.row === row; })[0]; }

  function update(b, changes, okMsg){
    var before = { status: b.status, nota: b.nota, rem: b.rem, rev: b.rev };
    if (changes.status) b.status = changes.status;
    if (changes.nota != null) b.nota = changes.nota;
    render();
    return call('dashUpdate', PIN, b.row, b.ref, changes).then(function(r){
      if (changes.mark && r && r.stamp) { b[changes.mark] = r.stamp; render(); }
      if (okMsg) toast(okMsg);
    }).catch(function(e){
      b.status = before.status; b.nota = before.nota; render(); toast(e, true);
    });
  }

  /* ---------- login ---------- */
  function login(pin){
    $('lErr').textContent = ''; $('goBtn').textContent = 'Memuatkan…';
    PIN = pin;
    return call('dashData', pin).then(function(d){
      D = d; store('dash_pin', pin);
      $('login').hidden = true; $('app').hidden = false;
      render(); show('today');
    }).catch(function(e){
      store('dash_pin', null); $('lErr').textContent = e; $('login').hidden = false; $('app').hidden = true;
    }).then(function(){ $('goBtn').textContent = 'Masuk'; });
  }
  function logout(){ store('dash_pin', null); PIN = ''; $('app').hidden = true; $('login').hidden = false; }

  $('goBtn').addEventListener('click', function(){ var p = $('pin').value.trim(); if (p) login(p); });
  $('pin').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('goBtn').click(); });
  $('refBtn').addEventListener('click', function(){ refresh(); });
  $('q').addEventListener('input', function(e){ Q = e.target.value; renderCust(); });

  document.addEventListener('click', function(e){
    var nv = e.target.closest('.nv button'); if (nv) return show(nv.dataset.v);
    var st = e.target.closest('[data-go]'); if (st) return show(st.dataset.go);
    var nb = e.target.closest('[data-note]'); if (nb) { $('n' + nb.dataset.note).classList.toggle('on'); return; }
    var sn = e.target.closest('[data-savenote]');
    if (sn) { var b = find(sn.dataset.savenote), v = $('n' + b.row).querySelector('textarea').value; return update(b, { nota: v }, 'Nota disimpan'); }
    var cu = e.target.closest('[data-cust]'); if (cu && !e.target.closest('a')) { cu.classList.toggle('open'); return; }
    var a = e.target.closest('a[data-act]');
    if (a) {   // biar link WhatsApp terbuka, kemaskini Sheet di belakang
      var bk = find(a.dataset.row), act = a.dataset.act;
      if (act === 'sahkan') setTimeout(function(){ update(bk, { status: 'Disahkan' }, 'Status: Disahkan'); }, 300);
      if ((act === 'rem' && !bk.rem) || (act === 'rev' && !bk.rev)) setTimeout(function(){ update(bk, { mark: act }, act === 'rem' ? 'Reminder ditanda' : 'Review ditanda'); }, 300);
    }
  });
  document.addEventListener('change', function(e){
    var s = e.target.closest('select.st'); if (!s) return;
    var b = find(s.dataset.row); update(b, { status: s.value }, 'Status: ' + s.value);
  });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && PIN && D) refresh(true); });
  setInterval(function(){ if (!document.hidden && PIN && D) refresh(true); }, 180000);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  var saved = load('dash_pin');
  if (saved) login(saved);
})();
</script>
</body>
</html>
